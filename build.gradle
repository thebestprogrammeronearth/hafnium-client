plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Dear ImGui (MIT) for HUD overlays ported from Anubis; bundled inside the mod jar.
    def imgui = "1.90.0"
    include(implementation("io.github.spair:imgui-java-binding:$imgui"))
    include(implementation("io.github.spair:imgui-java-lwjgl3:$imgui") { transitive = false })
    ["linux", "windows", "macos"].each { os ->
        include(runtimeOnly("io.github.spair:imgui-java-natives-$os:$imgui"))
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'hafnium-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
